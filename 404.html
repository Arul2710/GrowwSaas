<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | SAAS Product</title>
    <link rel="icon" type="image/jpg" href="image/growwpark_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: translateY(0) },
                            '50%': { transform: translateY(-20) },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

    <div class="min-h-screen flex items-center justify-center px-6 py-12">
        <div class="text-center max-w-xl w-full">
            
            <div class="relative mb-10 flex justify-center">
                <div class="absolute inset-0 flex justify-center items-center">
                    <div class="w-72 h-72 bg-blue-100 rounded-full opacity-60 animate-pulse-slow"></div>
                </div>

                <div class="relative z-10 animate-float">
                    <div class="text-[120px] md:text-[160px] font-black text-blue-600 leading-none tracking-tighter drop-shadow-xl">
                        404
                    </div>
                    <div class="mt-[-20px] flex justify-center">
                        <svg class="w-12 h-12 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="space-y-4 mb-10">
                <h1 class="text-3xl md:text-5xl font-bold text-slate-900 tracking-tight">
                    Page <span class="text-blue-600">Not Found</span>
                </h1>
                <p class="text-lg text-slate-500 max-w-md mx-auto leading-relaxed">
                    Sorry, the page you are looking for doesn't exist or has been moved. Let's get you back on track.
                </p>
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="/" class="inline-flex items-center justify-center px-8 py-3.5 border border-transparent text-base font-bold rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200 transition-all duration-200 shadow-lg shadow-blue-500/30 transform hover:-translate-y-1">
                    Return to Home
                </a>
                <a href="/support" class="inline-flex items-center justify-center px-8 py-3.5 border border-slate-200 text-base font-bold rounded-xl text-slate-600 bg-white hover:bg-slate-50 transition-all duration-200">
                    Contact Support
                </a>
            </div>

            <div class="mt-16 pt-8 border-t border-slate-100">
                <p class="text-xs font-medium text-slate-400 uppercase tracking-widest">
                    Error Code: ERR_PAGE_NOT_FOUND_404
                </p>
            </div>

        </div>
    </div>

</body>
</html>
